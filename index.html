<!doctype html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3A6E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keiko">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keiko Journal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700&family=Fredoka:wght@500;600;700&family=Hachi+Maru+Pop&display=swap">
<style>
/* Layout: one phone-width column. App bar on top, scrolling tab content, fixed bottom tab bar with a raised add button in the middle. Mood colors carry the personality; indigo (aizome, the kendo-gi dye) is the single accent. */
/* Kawaii Kendo stationery: palette tokens. Pastel fills are constants; theme accents are derived per theme in thTokens(). */
:root{
  --pink:#F3B8C6; --milk:#F9DCE5; --lav:#D9CCF4; --mint:#CDEBDD; --sky:#C8E5F6; --butter:#F7E7A9; --cream:#FFF8F0; --white:#FFFCFA; --navy:#34466A; --char:#45414A;
  --bg:#FFF8F0; --surface:#FFFCFA; --surface-2:#FCEBEF; --ink:#34466A; --ink-2:#645F72; --line:#F0D3DB;
  --accent:#C0356B; --accent-ink:#FFFFFF; --accent-soft:#FBE3EA; --danger:#B8324A; --cls:#1F8A7A; --tape:rgba(243,184,198,.75);
  --m1:#F3B8C6; --m2:#F9CDA6; --m3:#F7E7A9; --m4:#CDEBDD; --m5:#C8E5F6; --face:#34466A;
  --shadow:0 2px 0 rgba(52,70,106,.06),0 8px 20px rgba(192,53,107,.08);
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-cute:"Fredoka","Hachi Maru Pop","Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1A26; --surface:#2A2434; --surface-2:#352D42; --ink:#FFF1F4; --ink-2:#C9C0D6; --line:#443A55;
    --accent:#F59DB8; --accent-ink:#2A1A24; --accent-soft:#4A2C3D; --danger:#FF8FA3; --cls:#7FD8C6; --tape:rgba(245,157,184,.35);
    --m1:#E89BB0; --m2:#EDB98C; --m3:#E6D28A; --m4:#A9D8C0; --m5:#9CCDE8; --face:#2A2434;
    --shadow:0 2px 0 rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1A26; --surface:#2A2434; --surface-2:#352D42; --ink:#FFF1F4; --ink-2:#C9C0D6; --line:#443A55;
  --accent:#F59DB8; --accent-ink:#2A1A24; --accent-soft:#4A2C3D; --danger:#FF8FA3; --cls:#7FD8C6; --tape:rgba(245,157,184,.35);
  --m1:#E89BB0; --m2:#EDB98C; --m3:#E6D28A; --m4:#A9D8C0; --m5:#9CCDE8; --face:#2A2434;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.28);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.muted{color:var(--ink-2)}

.m1{--mc:var(--m1)} .m2{--mc:var(--m2)} .m3{--mc:var(--m3)} .m4{--mc:var(--m4)} .m5{--mc:var(--m5)}
.face{display:block;width:100%;height:100%}
.face .fb{fill:var(--mc)}
.face .fe{fill:var(--face)}
.face .fm{fill:none;stroke:var(--face);stroke-width:1.7;stroke-linecap:round}

.app{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:8px calc(112px + env(safe-area-inset-bottom,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 14px}
.top h1{font-family:var(--f-display);font-size:24px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.kanji{font-family:var(--f-display);font-size:13px;color:var(--ink-2);margin-left:10px;letter-spacing:.25em;font-weight:500}
.today{font-size:13px;color:var(--ink-2);text-align:right}
.topr{display:flex;align-items:center;gap:10px}
.btn[disabled]{opacity:.5;cursor:default}
.bk-card{display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.bk-card span{font-size:13px;color:var(--ink-2)}
.bk-msg{font-weight:600;color:var(--accent)}
.bk-small{font-size:12px;color:var(--ink-2)}
.bk-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.mk-g{width:5px;height:5px;border-radius:50%;background:var(--ink-2)}
.gev{display:flex;gap:12px;padding:10px 12px;background:var(--surface);border-radius:14px;margin-bottom:6px;font-size:14px;box-shadow:var(--shadow)}
.gev .gt{flex:none;min-width:64px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.gev span:last-child{min-width:0;overflow-wrap:anywhere}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;background:var(--surface);border-radius:16px;padding:8px 14px;box-shadow:var(--shadow)}
.toggle input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.confirm{background:var(--accent-soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm .row{display:flex;gap:8px}
.confirm .row .btn{flex:1}

.sbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);padding:10px 14px;border-radius:14px;font-size:13px;margin-bottom:12px}
.sbar button{color:var(--accent);font-weight:700;white-space:nowrap}

.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px}
.sec-head h2{font-family:var(--f-display);font-size:20px;font-weight:700}
.day-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:20px 0 8px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--surface);border-radius:20px;padding:12px 4px;box-shadow:var(--shadow)}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;border-radius:12px;padding:2px 0}
.wd small{font-size:11px;color:var(--ink-2);font-weight:600;letter-spacing:.04em}
.wd.is-today small{color:var(--accent);font-weight:700}
.wd .dot,.wd .ring{width:36px;height:36px;display:block}
.wd .ring{border-radius:50%;border:2px dashed var(--line)}

/* entry cards */
.card{display:block;width:100%;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.entry{display:flex;gap:12px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.ebadge{flex:none;width:48px;height:48px}
.face{object-fit:contain;-webkit-user-drag:none;user-select:none}
.ebody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.erow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.etime{font-weight:700;font-variant-numeric:tabular-nums}
.elabel{color:var(--ink-2);font-size:13px}
.chips-sm{display:flex;flex-wrap:wrap;gap:6px}
.achip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.achip.k{background:var(--accent-soft);color:var(--accent)}
.enote{font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ek{font-size:13px;font-weight:600;color:var(--accent);overflow-wrap:anywhere}
.enext{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.enext b{color:var(--ink)}

/* empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:32px 8px}
.empty .face{width:96px;height:96px}
.empty .big{font-family:var(--f-display);font-size:60px;line-height:1;color:var(--accent)}
.empty h2{font-family:var(--f-display);font-size:20px}
.empty p{color:var(--ink-2);max-width:34ch}
.empty .btns{display:flex;flex-direction:column;gap:8px;margin-top:8px;width:100%;max-width:300px}
.loading{padding:48px 0;text-align:center;color:var(--ink-2)}

/* buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--accent-bg,var(--accent));color:var(--accent-ink);text-align:center}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.small{min-height:36px;padding:0 14px;font-size:14px}
.btn.wide{width:100%;margin-top:12px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:18px;height:18px}
input[type=text],input[type=date],input[type=time],input[type=number],textarea{width:100%;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:72px;line-height:1.4}
::placeholder{color:var(--ink-2);opacity:.85}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.calhead h2{font-family:var(--f-display);font-size:20px;font-weight:700;flex:1;text-align:center}
.cal-tools{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--surface);border-radius:20px;padding:10px 6px;box-shadow:var(--shadow)}
.dow{text-align:center;font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;padding-bottom:4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 3px;border-radius:12px;min-width:0}
.cell.sel{background:var(--surface-2)}
.cnum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.cnum.has{background:var(--mc);color:var(--face)}
.cell.today .cnum{outline:2px solid var(--accent);outline-offset:1px}
.marks{height:8px;display:flex;gap:4px;align-items:center}
.mk-k{width:6px;height:6px;background:var(--accent-bg,var(--accent));transform:rotate(45deg)}
.mk-t{width:7px;height:7px;border-radius:2px;border:1.5px solid var(--ink-2);box-sizing:border-box}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin:10px 4px 0;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* tasks */
.addtask{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:4px}
.addtask .full{grid-column:1/-1}
.trow{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 12px;background:var(--surface);border-radius:16px;margin-bottom:6px;box-shadow:var(--shadow)}
.tcheck{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center}
.tcheck svg{width:16px;height:16px;opacity:0}
.trow.done .tcheck{background:var(--accent-bg,var(--accent));border-color:var(--accent);color:var(--accent-ink)}
.trow.done .tcheck svg{opacity:1}
.ttext{flex:1;min-width:0;display:flex;flex-direction:column}
.ttitle{overflow-wrap:anywhere}
.trow.done .ttitle{text-decoration:line-through;color:var(--ink-2)}
.tdue{font-size:12px;color:var(--ink-2)}
.tdue.late{color:var(--danger);font-weight:600}
.tdel{flex:none;width:40px;height:40px;border-radius:50%;color:var(--ink-2);display:grid;place-items:center}
.tdel svg{width:16px;height:16px}
.donebar{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px}
.donebar button{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:6px 0}
.donebar .link{color:var(--accent);text-transform:none;letter-spacing:0;font-size:13px}

/* kendo */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.stat{padding:14px 12px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--ink-2)}
.panel{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.panel h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}
.next-card{background:var(--accent-soft);border-radius:20px;padding:14px;margin-top:12px}
.next-card h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.next-card p{overflow-wrap:anywhere}
.next-card small{display:block;margin-top:6px;color:var(--ink-2);font-size:12px}
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;height:132px;border-bottom:1.5px solid var(--line)}
.bar{display:flex;flex-direction:column;align-items:center;min-width:0}
.bar em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-2);height:16px}
.bar .col{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar i{display:block;width:100%;max-width:26px;background:var(--accent-bg,var(--accent));border-radius:6px 6px 2px 2px;min-height:2px}
.bar.zero i{background:var(--line)}
.bars-x{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.bars-x span{font-size:10px;color:var(--ink-2);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.fq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fq li{display:grid;grid-template-columns:104px 1fr 28px;gap:10px;align-items:center;font-size:14px}
.fq .ft{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.fq .ft i{display:block;height:100%;background:var(--accent-bg,var(--accent));border-radius:99px}
.fq .fc{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr 1fr 64px 1fr 1fr;align-items:center;padding:6px 8px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:var(--ink-2);font-size:11px;font-weight:600;border-radius:14px;min-width:0}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab .glyph{font-family:var(--f-display);font-size:20px;line-height:24px;height:24px;font-weight:700}
.fab{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--accent-bg,var(--accent));color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(58,71,165,.35);margin-top:-16px}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

/* entry sheet */
.sheet-root{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(10,12,30,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin-inline:auto;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px}
.sheet-head h2{font-family:var(--f-display);font-size:20px;font-weight:700}
.sheet-body{overflow:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-foot .main{flex:1}
fieldset{border:0;padding:0;margin:0;min-width:0}
.lbl,legend{display:block;padding:0;margin-bottom:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
label.field{display:block}
.when{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.mood-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:16px;font-size:12px;font-weight:600;color:var(--ink-2);border:2px solid transparent;min-width:0}
.mbtn .face{width:48px;height:48px;opacity:.6;filter:saturate(.7)}
.mbtn.on{border-color:var(--mc);color:var(--ink);background:var(--surface-2)}
.mbtn.on .face{opacity:1;filter:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px;border:1.5px solid transparent}
.chip.on{background:var(--accent-bg,var(--accent));color:var(--accent-ink)}
.chip.add{background:transparent;border:1.5px dashed var(--ink-2);color:var(--ink-2)}
.newact{display:flex;gap:8px;margin-top:10px}
.kbox{display:flex;flex-direction:column;gap:18px;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.kbox h3{font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--accent)}
.minrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.minrow input{width:84px;text-align:center}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fbtn{min-height:44px;border-radius:12px;background:var(--surface-2);font-weight:700;display:grid;place-items:center}
.fbtn.on{background:var(--accent-bg,var(--accent));color:var(--accent-ink)}
.feellbl{margin-top:6px;font-size:13px;color:var(--ink-2);min-height:1.4em}
.err{color:var(--danger);font-weight:600;font-size:14px}

.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.tag.k{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.mk-j{width:8px;height:3px;background:var(--accent-bg,var(--accent));border-radius:2px}
.minpre{display:contents}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;background:var(--surface);border:2px solid transparent;box-shadow:var(--shadow);min-width:0;text-align:center}
.tbtn .kj{font-family:var(--f-display);font-size:22px;line-height:1.25;font-weight:700}
.tbtn b{font-size:13px}
.tbtn small{font-size:11px;color:var(--ink-2);line-height:1.2}
.tbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.tbtn.on .kj,.tbtn.on b{color:var(--accent)}
.eplace{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-2);min-width:0}
.eplace svg{width:14px;height:14px;flex:none}
.eplace span{overflow-wrap:anywhere}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:var(--surface-2)}
#placeChips{margin-top:8px}
#placeChips:empty{display:none}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.ph{position:relative;width:88px;height:88px}
.ph .zoom{display:block;width:100%;height:100%;border-radius:14px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface-2)}

/* ===== Kawaii layer: cards, stickers, washi tape, pill tab bar. Decorations are pseudo-elements gated by html:not(.no-deco). ===== */
body{background-color:var(--bg);font-size:15px}
html:not(.no-deco) body{background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--accent) 14%,transparent) 1.2px,transparent 1.6px);background-size:22px 22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;box-shadow:0 0 0 6px color-mix(in srgb,var(--bg) 80%,transparent)}
.top{position:relative;border-bottom:2px dashed var(--line);margin-bottom:14px;padding-block:12px 14px}
.top h1{font-family:var(--f-cute);font-size:23px;line-height:1.15;font-weight:700;letter-spacing:.01em;color:var(--accent);text-shadow:2px 2px 0 var(--accent-soft)}
html:not(.no-deco) .top h1::before{content:none}
html:not(.no-deco) .top h1::after{content:"\2727";color:var(--pink);font-size:.5em;margin-left:4px;vertical-align:.7em}
.kanji{font-family:var(--f-cute);background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px;letter-spacing:.12em;font-size:12px;font-weight:700;vertical-align:.2em}
.today{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:600}
.iconbtn{border:2px solid var(--line);box-shadow:0 2px 0 var(--line)}
.sec-head h2,.calhead h2{font-size:22px}
.day-h,.bk-h,.panel h3,.lbl,legend{color:var(--accent);letter-spacing:.06em}
.card,.panel,.stats,.week,.grid,.kbox,.trow,.clrow,.gev,.bk-card,.toggle,.ncard,.fpk{border:2px solid var(--line)}
.card,.panel,.stats,.week,.grid,.kbox,.trow,.clrow{border-radius:22px;box-shadow:0 3px 0 var(--line),var(--shadow)}
.entry{position:relative;padding:14px 16px;margin-bottom:12px}
html:not(.no-deco) .entry::before{content:"";position:absolute;top:-7px;right:18px;width:46px;height:14px;background:var(--tape);border-radius:3px;transform:rotate(3deg);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px);pointer-events:none}
.entry:nth-of-type(3n+2)::before{transform:rotate(-4deg);right:auto;left:22px}
.ebadge{width:54px;height:54px;border-radius:50%;background:var(--mc);display:grid;place-items:center;padding:4px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.ebadge .face{border-radius:50%}
.etime{font-family:var(--f-display)}
.achip,.tag{border-radius:99px;background:var(--surface-2);border:1.5px solid var(--line)}
.achip.k,.tag.k{background:var(--accent-soft);border-color:transparent}
.ek{font-family:var(--f-display)}
.week{padding:14px 6px;border-radius:26px}
.wd.is-today{background:var(--accent-soft);border-radius:18px;box-shadow:inset 0 0 0 2px var(--accent)}
.wd .ring{border:2px dashed var(--ink-2);opacity:.5}
.empty{border:2px dashed var(--line);border-radius:28px;background:color-mix(in srgb,var(--surface) 70%,transparent);margin-top:8px;padding:30px 16px;position:relative}
html:not(.no-deco) .empty::before{content:"\2726  \2727";position:absolute;top:12px;left:20px;color:var(--pink);font-size:16px;letter-spacing:.3em}
html:not(.no-deco) .empty::after{content:"\2727  \2726";position:absolute;bottom:12px;right:20px;color:var(--lav);font-size:16px;letter-spacing:.3em}
.empty .face{width:104px;height:104px;border-radius:50%;background:var(--m1);padding:8px;box-shadow:0 4px 0 var(--line)}
.empty .btns .btn{width:100%}
.btn{border-radius:99px;min-height:46px;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000 15%);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000 15%)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.danger{box-shadow:inset 0 0 0 2px currentColor}
.btn.small{min-height:38px}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,.tin,.vrow input{border:2px solid var(--line);border-radius:16px;background:var(--surface)}
input:focus-visible,textarea:focus-visible{border-color:var(--accent)}
.chip{background:var(--surface);border:2px solid var(--line);color:var(--ink)}
.chip.on{background:var(--accent-bg,var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 50%,#000 15%)}
.chip.add{background:transparent;border:2px dashed var(--ink-2);color:var(--ink-2)}
.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent-soft)}
.cnum.has{box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.cell.today .cnum{outline:2px dashed var(--accent);outline-offset:2px}
.dow{color:var(--accent)}
.trow{padding:10px 10px 10px 14px}
.tcheck{border:2.5px solid var(--accent);border-radius:50%;background:var(--surface)}
.trow.done{opacity:.85}
.trow.done .tcheck{box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 55%,#000 15%)}
.stats{background:transparent;border:0;box-shadow:none;gap:10px}
.stat{border:2px solid var(--line)!important;border-radius:20px;background:var(--milk);color:#34466A;box-shadow:0 3px 0 var(--line);padding:12px 10px}
.stat+.stat{border-left:2px solid var(--line)}
.stat:nth-child(2){background:var(--lav)}.stat:nth-child(3){background:var(--mint)}
.stat span{color:#5B5668}
.next-card{background:var(--butter);color:#34466A;border:2px dashed #D9C36A;border-radius:22px;position:relative}
.next-card h3{color:#6B5A10}.next-card small{color:#5B5668}
html:not(.no-deco) .next-card::before{content:"";position:absolute;top:-8px;left:24px;width:54px;height:15px;background:var(--tape);border-radius:3px;transform:rotate(-3deg);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)}
.bar i,.fq .ft i{border-radius:99px 99px 4px 4px}.fq .ft i{border-radius:99px}
.nextclass{border:2px solid var(--line);border-left:6px solid var(--cls);border-radius:20px;box-shadow:0 3px 0 var(--line)}
.clrow{border-left:6px solid var(--cls)}
.ncard{border-radius:22px;box-shadow:0 3px 0 var(--line)}
.sbar,.confirm{border:2px dashed var(--line);border-radius:20px}
/* tab bar: floating pill */
.tabbar{background:transparent;border:0;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar-in{pointer-events:auto;background:var(--surface);border:2px solid var(--line);border-radius:32px;box-shadow:0 4px 0 var(--line),0 10px 24px rgba(52,70,106,.12);padding:6px 8px}
.tab{border-radius:22px;min-height:50px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.fab{width:60px;height:60px;margin-top:-26px;border:4px solid var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000 15%),0 8px 18px rgba(192,53,107,.3);background:var(--accent-bg,var(--accent))}
.fab:active{transform:translateY(2px)}
.app{padding-block:8px calc(128px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(108px + env(safe-area-inset-bottom,0px));border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
/* sheets */
.scrim{background:rgba(52,40,66,.45)}
.sheet{border-radius:30px 30px 0 0;border:2px solid var(--line);border-bottom:0;box-shadow:0 -6px 30px rgba(52,40,66,.18)}
html:not(.no-deco) .sheet::before{content:"";align-self:center;width:44px;height:5px;border-radius:99px;background:var(--line);margin-top:8px;flex:none}
.sheet-head h2{font-size:21px}
.sheet-foot{border-top:2px dashed var(--line);background:var(--bg)}
.mbtn{border-radius:20px;background:var(--surface)}
.mbtn .face{background:var(--mc);border-radius:50%;padding:3px;opacity:.7}
.mbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.tbtn{border:2px solid var(--line);border-radius:20px}
.tbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.fbtn{background:var(--surface);border:2px solid var(--line);border-radius:14px}
.fbtn.on{border-color:transparent}
.ph .zoom,.thumbs img,.addph{border-radius:16px}
.ph .zoom{border:3px solid var(--surface);box-shadow:0 2px 0 var(--line),var(--shadow);transform:rotate(-1.5deg)}
.ph:nth-child(even) .zoom{transform:rotate(1.5deg)}
.sw{border-width:3px}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.foot{color:var(--ink-2)}
.dec-row{display:flex;gap:8px;flex-wrap:wrap}
html.no-deco .tape,html.no-deco .sparkle{display:none}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

.stamps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:20px;border:2px dashed var(--line);text-align:center;color:var(--ink-2);min-width:0}
.stamp .sg{font-family:var(--f-display);font-size:24px;line-height:1.2;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2)}
.stamp b{font-size:12px;line-height:1.2;overflow-wrap:anywhere}.stamp small{font-size:11px}
.stamp.got{border:2px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--line);transform:rotate(-2deg)}

const FP_KEY='kj-faces';const FP_NAMES={1:'Awful',2:'Bad',3:'Meh',4:'Good',5:'Rad'};
const FP_SETS={helmet:FACES,girl:FACES2,fold:FACES3,shiba:FACES4,blond:FACES5},FP_ALL=Object.keys(FP_SETS);
let fpSel={pack:'helmet',base:'helmet',mine:{}};
function fpLoad(){try{const o=JSON.parse(localStorage.getItem(FP_KEY)||'{}');if(FP_ALL.includes(o.pack)||o.pack==='mine')fpSel.pack=o.pack;if(FP_ALL.includes(o.base))fpSel.base=o.base;if(o.mine&&typeof o.mine==='object')for(const k of [1,2,3,4,5])if(typeof o.mine[k]==='string'&&o.mine[k].startsWith('data:image/'))fpSel.mine[k]=o.mine[k]}catch(e){}}
function fpSave(){try{localStorage.setItem(FP_KEY,JSON.stringify(fpSel))}catch(e){toast('Could not save faces on this device.')}}
const fpSrc=(m,pack)=>{pack=pack||fpSel.pack;if(pack==='mine')return fpSel.mine[m]||fpSrc(m,fpSel.base);return (FP_SETS[pack]||FACES)[m]};

/* ---------- backup file v2: save, share, restore ----------
   Format: {app,v:2,schema,ts,counts,sha256,items,prefs}. v1 files ({app,v:1,items}) still restore.
   Restore rules: only records whose id is missing are added; existing records are never overwritten or removed;
   the "cfg" record is merged (custom activities and focus lists are unioned); locked notes are skipped when this
   phone already has a different lock code; invalid records are rejected and listed. All adds happen in one transaction. */
const LASTEXP='kj-last-export',BK_KINDS=['entry','task','cfg','img','class','note','lock','tag','event'],SCHEMA=2;
const lastExp=()=>{try{return +localStorage.getItem(LASTEXP)||0}catch(e){return 0}};
const markExp=()=>{try{localStorage.setItem(LASTEXP,String(Date.now()))}catch(e){}};
function backupNudge(){
  const n=[...S.items.values()].filter(x=>x.kind==='entry'||x.kind==='task').length,t=lastExp();
  if(n>=5&&(!t||Date.now()-t>14*864e5))toast('Tip: save a backup file (cloud icon, top right).');
}
async function sha256(str){
  if(!(window.crypto&&crypto.subtle))return '';
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function prefsSnap(){
  const o={};
  [['theme','kj-theme'],['name','kj-name'],['deco','kj-deco'],['faces','kj-faces']].forEach(a=>{try{const v=localStorage.getItem(a[1]);if(v!==null)o[a[0]]=v}catch(e){}});
  return o;
}
async function backupFile(){
  const items=[...S.items.values()].filter(x=>BK_KINDS.includes(x.kind));
  const counts={};items.forEach(x=>{counts[x.kind]=(counts[x.kind]||0)+1});
  const itemsJson=JSON.stringify(items);
  const sum=await sha256(itemsJson);
  const text='{"app":"keiko-journal","v":2,"schema":'+SCHEMA+',"ts":'+Date.now()+',"counts":'+JSON.stringify(counts)+',"sha256":"'+sum+'","prefs":'+JSON.stringify(prefsSnap())+',"items":'+itemsJson+'}';
  const blob=new Blob([text],{type:'application/json'});
  /* read it back and check it before reporting success */
  const back=JSON.parse(await blob.text());
  if(!Array.isArray(back.items)||back.items.length!==items.length)throw new Error('self-check count mismatch');
  if(sum&&await sha256(JSON.stringify(back.items))!==sum)throw new Error('self-check checksum mismatch');
  const odd=items.filter(x=>bkCheck(x)).map(x=>x.kind+' '+String(x.id).slice(0,16)+': '+bkCheck(x));
  if(odd.length)console.warn('Backup written, but these records would be rejected on restore:',odd);
  return {name:'keiko-journal-backup-'+todayStr()+'.json',blob,count:items.length,photos:counts.img||0,odd:odd.length};
}

  S.bk.msg=how+' '+f.count+' items ('+f.photos+' photos) were written and re-read successfully.'+(f.odd?' '+f.odd+' record'+(f.odd===1?'':'s')+' may be refused when restoring.':'')+' Your phone decides where the file goes, so check that it really arrived before you rely on it.';

const DATE_RE=/^\d{4}-\d\d-\d\d$/,isStr=v=>typeof v==='string',isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function bkCheck(x){
  if(!isObj(x))return 'not an object';
  if(!isStr(x.id)||!x.id||x.id.length>120)return 'bad id';
  if(!BK_KINDS.includes(x.kind))return 'unknown kind';
  if(JSON.stringify(x).length>12e6)return 'too large';
  switch(x.kind){
    case 'entry':if(!DATE_RE.test(x.date||''))return 'bad date';if(!Number.isInteger(x.mood)||x.mood<1||x.mood>5)return 'bad mood';if(x.photos!==undefined&&!Array.isArray(x.photos))return 'bad photos';if(x.tags!==undefined&&!Array.isArray(x.tags))return 'bad tags';break;
    case 'task':if(!isStr(x.title))return 'no title';if(x.due&&!DATE_RE.test(x.due))return 'bad due date';break;
    case 'img':if(!(isStr(x.data)&&/^data:image\//.test(x.data))&&!isObj(x.enc))return 'bad image';break;
    case 'class':if(!isStr(x.title))return 'no title';break;
    case 'event':if(!isStr(x.title))return 'no title';if(!DATE_RE.test(x.start||''))return 'bad start date';if(x.end&&!DATE_RE.test(x.end))return 'bad end date';break;
    case 'note':if(x.locked){if(!isObj(x.enc))return 'locked note without data'}else if(!isStr(x.title||'')||!isStr(x.body||''))return 'bad text';break;
    case 'lock':if(!isStr(x.salt)||!isStr(x.chk))return 'bad lock';break;
    case 'tag':if(!isStr(x.name)||!x.name)return 'no name';break;
    case 'cfg':if(x.acts!==undefined&&!Array.isArray(x.acts))return 'bad activities';break;
  }
  return '';
}
async function bkParse(text){
  let data;
  try{data=JSON.parse(text)}catch(e){return {fatal:"That file isn't readable JSON."}}
  const list=Array.isArray(data)?data:data&&data.items;
  if(!Array.isArray(list)||(!Array.isArray(data)&&data.app!=='keiko-journal'))return {fatal:"That file isn't a Keiko Journal backup."};
  const v=Array.isArray(data)?0:(+data.v||1);
  if(v>SCHEMA)return {fatal:'This backup was made by a newer version of the app. Update the app first.'};
  if(v>=2&&data.sha256){const sum=await sha256(JSON.stringify(list));if(sum&&sum!==data.sha256)return {fatal:'The checksum does not match, so the file is damaged or was edited. Nothing was changed.'}}
  const valid=[],rejected=[],seen=new Set();
  list.forEach(x=>{const why=bkCheck(x);if(why){rejected.push({id:isObj(x)&&isStr(x.id)?x.id:'?',kind:isObj(x)?x.kind:'?',why});return}if(seen.has(x.id)){rejected.push({id:x.id,kind:x.kind,why:'duplicate id in file'});return}seen.add(x.id);valid.push(x)});
  return {plan:{valid,rejected,v,prefs:isObj(data.prefs)?data.prefs:null}};
}
function bkPlan(p){
  const loc=S.items.get('lock'),add=[],same=[],skipLock=[],cfgMerge=[];
  const lockedImgs=new Set(p.valid.filter(x=>x.kind==='note'&&x.locked).flatMap(x=>x.photos||[]));
  p.valid.forEach(x=>{
    if(x.kind==='cfg'){if(S.items.has('cfg'))cfgMerge.push(x);else add.push(x);return}
    if(S.items.has(x.id)){same.push(x);return}
    const lockedItem=(x.kind==='note'&&x.locked)||(x.kind==='img'&&x.enc);
    if(lockedItem&&loc){const inFile=p.valid.find(y=>y.kind==='lock');if(!inFile||inFile.salt!==loc.salt){skipLock.push(x);return}}
    if(x.kind==='lock'&&loc){skipLock.push(x);return}
    add.push(x);
  });
  const have=new Set([...S.items.keys(),...add.map(x=>x.id)]);
  let missing=0;add.forEach(x=>{if(x.kind==='entry'||x.kind==='note')(x.photos||[]).forEach(id=>{if(!have.has(id))missing++})});
  return {add,same,skipLock,cfgMerge,missing,rejected:p.rejected,prefs:p.prefs,v:p.v,valid:p.valid,mode:'add'};
}
function mergeCfg(cur,inc){
  const acts=[...(cur.acts||[])];(inc.acts||[]).forEach(a=>{if(isStr(a)&&!acts.includes(a))acts.push(a)});
  const out=Object.assign({},cur,{acts});
  if(isObj(inc.focus)){const f=Object.assign({},cur.focus||{});Object.keys(inc.focus).forEach(t=>{if(Array.isArray(inc.focus[t])){const l=[...(f[t]||[])];inc.focus[t].forEach(a=>{if(isStr(a)&&!l.includes(a))l.push(a)});f[t]=l}});out.focus=f}
  return out;
}
async function importFile(file){
  if(!file)return;
  S.bk.err='';S.bk.msg='';S.bk.plan=null;
  if(file.size>300e6){S.bk.err='That file is too large to restore safely.';renderBackup();return}
  try{
    const r=await bkParse(await file.text());
    if(r.fatal)S.bk.err=r.fatal;
    else{
      const pl=bkPlan(r.plan);
      S.bk.plan=pl;
    }
  }catch(e){S.bk.err="That file couldn't be read. Nothing was changed."}
  renderBackup();
}
async function applyPlan(){
  const pl=S.bk.plan;if(!pl)return;
  const replace=pl.mode==='replace';
  try{
    if(replace){
      if(S.mode!=='idb')throw new Error('Replace needs the main storage.');
      /* 1. safety copy of everything currently here, 2. one transaction: delete what the file does not have, write the file */
      const cur=[...S.items.values()].filter(x=>BK_KINDS.includes(x.kind));
      const txt=JSON.stringify({app:'keiko-journal',v:SCHEMA,ts:Date.now(),items:cur});
      const sid='safety-'+Date.now();
      const old=[...S.items.values()].filter(x=>x.kind==='safety').sort((a,b)=>b.ts-a.ts);
      const sdoc={kind:'safety',id:sid,ts:Date.now(),count:cur.length,photos:cur.filter(x=>x.kind==='img').length,text:txt};
      await idbTx(st=>st.put(sdoc));S.items.set(sid,sdoc);
      const drops=old.slice(2).map(x=>x.id);
      const keep=new Set(pl.valid.map(x=>x.id)),gone=cur.filter(x=>!keep.has(x.id)).map(x=>x.id);
      await idbTx(st=>{pl.valid.forEach(x=>st.put(x));gone.forEach(id=>st.delete(id));drops.forEach(id=>st.delete(id))});
      gone.forEach(id=>S.items.delete(id));drops.forEach(id=>S.items.delete(id));pl.valid.forEach(x=>S.items.set(x.id,x));
      refresh();
      S.bk.msg='Replaced everything with the backup: '+pl.valid.length+' items'+(pl.rejected.length?', '+pl.rejected.length+' rejected':'')+'. A safety copy of what was here before is kept below.';S.bk.err='';
      bkLog('Replace restore: '+pl.valid.length+' items in, '+gone.length+' not in the file were removed (safety copy kept)');
    }else{
      const cfgNew=pl.cfgMerge.length?pl.cfgMerge.reduce((c,x)=>mergeCfg(c,x),S.items.get('cfg')):null;
      const writes=[...pl.add];if(cfgNew)writes.push(cfgNew);
      if(S.mode==='idb'&&writes.length)await idbTx(st=>writes.forEach(x=>st.put(x)));
      writes.forEach(x=>S.items.set(x.id,x));
      if(S.mode!=='idb'&&writes.length)saveLocal();
      refresh();
      const bits=['Added '+pl.add.length+' item'+(pl.add.length===1?'':'s'),pl.same.length+' already here (kept as they were)'];
      if(pl.skipLock.length)bits.push(pl.skipLock.length+' locked item'+(pl.skipLock.length===1?'':'s')+' skipped (different lock code)');
      if(pl.rejected.length)bits.push(pl.rejected.length+' rejected');
      if(pl.missing)bits.push(pl.missing+' photo'+(pl.missing===1?' is':'s are')+' not in the file');
      S.bk.msg=bits.join(' · ')+'. Nothing was removed.';S.bk.err='';
      bkLog('Restore (add what is missing): '+bits.join(', '));
    }
    S.bk.prefsPending=pl.prefs&&Object.keys(pl.prefs).length?pl.prefs:null;
  }catch(e){
    S.bk.err=(e&&e.name==='QuotaExceededError'?'Not enough storage on this phone. ':'Writing failed. ')+'Nothing was changed.';S.bk.msg='';
    bkLog('Restore failed, nothing changed');
  }
  S.bk.plan=null;renderBackup();
}

function kLine(k){

/* achievement stamps: computed from your data, no streaks, nothing to lose */
function stampList(){

  const td=all.filter(x=>x.kind==='task'&&x.done).length,tg=all.filter(x=>x.kind==='tag').length;

function vKendo(){
  if(S.loading)return loadingHtml();
  const ksAll=entries().filter(e=>e.kendo);
  const ks=S.kf==='all'?ksAll:ksAll.filter(e=>T(e)===S.kf);
  const head='<div class="sec-head"><h2>Kendo log</h2><button class="btn small" data-action="new" data-type="keiko">Log practice</button></div>';
  if(!ksAll.length)return head+`<div class="empty">${face(4)}<h2>Ready for your first keiko?</h2><p>Record time on the floor, what you worked on, and what sensei said. Your totals and focus areas build up here.</p><div class="btns"><button class="btn" data-action="new" data-type="keiko">Log keiko</button><button class="btn ghost" data-action="new" data-type="jishuren">Log jishuren</button></div></div>`;
  const filt=filterBar('kfilter',S.kf,false);
  if(!ks.length)return head+filt+'<p class="muted" style="margin-top:20px">Nothing logged for this type yet.</p>';
  const t=todayStr(),ym=t.slice(0,7);
  const mo=ks.filter(e=>e.date.startsWith(ym));
  const mins=mo.reduce((a,e)=>a+(+e.kendo.min||0),0);
  const since=Math.max(0,Math.round((parse(t)-parse(ks[0].date))/864e5));
  const stats=`<div class="stats"><div class="stat"><b>${mo.length}</b><span>Sessions this month</span></div><div class="stat"><b>${mins?fmtMin(mins):'0 min'}</b><span>Time this month</span></div><div class="stat"><b>${since===0?'Today':since+(since===1?' day':' days')}</b><span>Since last practice</span></div></div>`;
  const nx=ks.find(e=>e.kendo.next);
  const next=nx?`<div class="next-card"><h3>Work on next</h3><p>${esc(nx.kendo.next)}</p><small>From ${esc(fmtDay(nx.date))}</small></div>`:'';
  const mon=mondayOf(t),weeks=[];
  for(let i=7;i>=0;i--){const s=addDays(mon,-7*i),e=addDays(s,6);weeks.push({s,v:ks.filter(x=>x.date>=s&&x.date<=e).reduce((a,x)=>a+(+x.kendo.min||0),0)})}
  const max=Math.max(1,...weeks.map(w=>w.v));
  const bars=weeks.map(w=>`<div class="bar${w.v?'':' zero'}"><em>${w.v||''}</em><div class="col"><i style="height:${w.v?Math.max(3,Math.round(w.v/max*100)):0}%"></i></div></div>`).join('');
  const xs=weeks.map(w=>`<span>${esc(L(w.s,{day:'numeric',month:'short'}))}</span>`).join('');
  const chart=`<div class="panel"><h3>Minutes per week</h3><div class="bars" role="img" aria-label="Minutes of keiko per week, last 8 weeks">${bars}</div><div class="bars-x" aria-hidden="true">${xs}</div></div>`;
  const cut=addDays(t,-29),cnt={};
  ks.filter(e=>e.date>=cut).forEach(e=>(e.kendo.focus||[]).forEach(f=>{cnt[f]=(cnt[f]||0)+1}));

function imgOk(f){return !!f&&/^image\/(jpeg|png|webp|gif|heic|heif|avif|bmp)$/i.test(f.type||'')&&f.size>0&&f.size<=30e6}
function shrink(file){
  return new Promise((res,rej)=>{
    if(!imgOk(file))return rej(new Error('bad image'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const r=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
      let q=.72,out=c.toDataURL('image/jpeg',q);
      while(out.length>170000&&q>.4){q-=.08;out=c.toDataURL('image/jpeg',q)}
      res(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};
    im.src=url;
  });
}

function explain(e){

  if(c==='not_in_manifest'||c==='consent_required')return "Drive access is turned off for this page. Allow it in the page's permissions menu, then try again.";
  if(c==='blocked_by_policy'||c==='approval_required')return 'Your organization does not allow this Drive action.';
  if(c==='server_unavailable'||c==='upstream_error'||c==='rate_limited')return "Google Drive didn't answer. Try again in a moment.";
  if(c==='tool_error')return 'Google Drive refused the request. '+String((e&&e.message)||'').slice(0,140);
  const m=e&&e.message;
  if(m==='none')return 'No backup found in your Drive yet. Run a backup first.';

async function runBackup(manual){

  S.bk.busy=true;S.bk.err='';S.bk.msg='Connecting to Google Drive…';S.bk.confirm=false;renderBackup();
  const d=Object.assign({},driveDoc());d.photoFiles=Object.assign({},d.photoFiles);
  let ok=false;
  try{
    await ensureFolder(d,false,false);
    const ids=[];
    entries().forEach(e=>(e.photos||[]).forEach(p=>{if(!ids.includes(p))ids.push(p)}));
    const todo=ids.filter(id=>!d.photoFiles[id]&&S.items.get(id)&&S.items.get(id).data);
    for(let i=0;i<todo.length;i++){
      S.bk.msg='Saving photo '+(i+1)+' of '+todo.length+'…';renderBackup();
      const data=S.items.get(todo[i]).data,pt=todo[i]+'.jpg';

    const input={title,contentMimeType:'application/json',disableConversionToGoogleType:true};

      input.base64Content={$file:{data:new Blob([text],{type:'application/json'}),name:title,type:'application/json'}};
    }
    const r=await gcreate(d,input);

    const older=old.filter(f=>f.title!==title).sort((a,b)=>String(b.title).localeCompare(String(a.title)));
    const stale=old.filter(f=>f.title===title).concat(older.slice(KEEP_DAYS-1));
    for(const f of stale){try{await gcall('trash_file',{fileId:f.id})}catch(e){}}

function pickStr(x,depth){
  if(typeof x==='string')return x;
  if(!x||typeof x!=='object'||depth>3)return '';
  for(const k of ['content','base64Content','data','fileContent','body','text']){if(typeof x[k]==='string')return x[k]}
  let best='';
  for(const k in x){const v=pickStr(x[k],depth+1);if(v.length>best.length)best=v}
  return best;
}
function fromB64(b){
  const bin=atob(b.replace(/\s/g,'').replace(/-/g,'+').replace(/_/g,'/'));
  return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
}
function parseDownload(r){
  const s=pickStr(r&&r.payload,0)||pickStr(r&&r.content,0);
  if(!s)return null;
  const t=s.trim();
  try{if(t[0]==='{')return JSON.parse(t)}catch(e){}
  try{return JSON.parse(fromB64(t))}catch(e){}
  return null;
}
function parsePhoto(r){
  const blk=((r&&r.content)||[]).find(b=>b&&b.type==='image'&&b.data);
  if(blk)return 'data:'+(blk.mimeType||'image/jpeg')+';base64,'+blk.data;
  const s=pickStr(r&&r.payload,0).trim();
  if(s.startsWith('data:'))return s;
  if(s.length>100&&/^[A-Za-z0-9+/_=\s-]+$/.test(s))return 'data:image/jpeg;base64,'+s.replace(/\s/g,'').replace(/-/g,'+').replace(/_/g,'/');
  return null;
}
async function runRestore(){

  const d=Object.assign({},driveDoc());d.photoFiles=Object.assign({},d.photoFiles);
  let ok=false,added=0,pics=0;
  try{
    await ensureFolder(d,false,true);
    const files=await findData(d);
    if(!files.length)throw new Error('none');
    files.sort((a,b)=>String(b.title).localeCompare(String(a.title)));
    S.bk.msg='Reading '+files[0].title+'…';renderBackup();

    if(!bk||bk.app!=='keiko-journal'||!Array.isArray(bk.items))throw new Error('bad');
    for(const it of bk.items){
      if(!it||!it.id)continue;
      if(it.kind==='cfg'){
        const cur=S.items.get('cfg'),acts=[...new Set(((cur&&cur.acts)||[]).concat(it.acts||[]))];
        if(!cur||acts.length!==(cur.acts||[]).length)await put({kind:'cfg',id:'cfg',acts});

      }
      if((it.kind==='entry'||it.kind==='task')&&!S.items.has(it.id)){await put(it);added++}
    }
    const pf=bk.photoFiles||{},need=[];
    bk.items.forEach(it=>{if(it&&it.kind==='entry')(it.photos||[]).forEach(p=>{if(!S.items.has(p)&&pf[p]&&!need.includes(p))need.push(p)})});
    for(let i=0;i<need.length;i++){
      S.bk.msg='Restoring photo '+(i+1)+' of '+need.length+'…';renderBackup();
      try{const uri=parsePhoto(await gcall('download_file_content',{fileId:pf[need[i]]}));if(uri){await put({kind:'img',id:need[i],data:uri,ts:Date.now()});pics++}}catch(e){}

  }catch(e){S.bk.err=explain(e)}

  await put(d);renderBackup();
}

function bucketEvents(events){
  const own=new Set(Object.values(gcalDoc().map||{}).map(x=>x&&x.eid)),byDay={};
  const add=(d,o)=>{(byDay[d]=byDay[d]||[]).push(o)};
  for(const ev of events){

    const id=ev.id||ev.eventId||'';

    const st=evTime(ev,'start');if(!st)continue;

    if(st.length<=10){
      const en=evTime(ev,'end');

async function runCalSync(manual){
  if(S.cb.busy)return;
  await S.mcpP;
  if(!S.mcp){if(manual){S.cb.err='Calendar sync only works inside Claude.';renderBackup()}return}
  const g0=gcalDoc(),g=Object.assign({},g0,{map:Object.assign({},g0.map)});
  S.cb.busy=true;S.cb.err='';S.cb.msg='Syncing with Google Calendar…';renderBackup();
  let ok=false,c=0,u=0,x=0;

    const D=calDesired(g),M=g.map;
    for(const id of Object.keys(D)){
      const w=D[id],sig=JSON.stringify([w.summary,w.start,w.end,w.allDay,w.desc]),cur=M[id];
      if(cur&&cur.sig===sig)continue;
      const body={summary:w.summary,description:w.desc,startTime:w.start,endTime:w.end,timeZone:TZ};

        try{await gcal('update_event',Object.assign({eventId:cur.eid},body));M[id]={eid:cur.eid,sig};u++;continue}
        catch(e){if(!(e&&e.code==='tool_error'))throw e}
      }

      if(!eid)throw new Error('noid');

      S.cb.msg='Synced '+(c+u)+' items…';renderBackup();
    }

      catch(e){if(!(e&&e.code==='tool_error'))throw e}

}

async function lkUnlock(code){
  const d=lockDoc();if(!d)return false;
  try{
    const key=await lkDerive(code,b64u8(d.salt),d.iter);const c=await lkDec(key,d.chk);if(!c||c.ok!==1)return false;
    S.lkPlain=new Map();S.lkImg=new Map();
    for(const n of lockedNotes()){try{const pl=await lkDec(key,n.enc);S.lkPlain.set(n.id,pl);for(const pid of pl.photos||[]){const im=S.items.get(pid);if(im&&im.enc){try{S.lkImg.set(pid,(await lkDec(key,im.enc)).data)}catch(e){}}}}catch(e){}}
    S.lk=key;return true;
  }catch(e){return false}
}
async function lkSetup(code){const m=await lkMake(code);await put(m.doc);S.lk=m.key;S.lkPlain=new Map();S.lkImg=new Map()}
async function lkChange(code){
  const m=await lkMake(code),now=Date.now();
  for(const n of lockedNotes()){const pl=S.lkPlain.get(n.id);if(!pl)continue;
    for(const pid of pl.photos||[]){const dt=S.lkImg.get(pid);if(dt)await put({kind:'img',id:pid,enc:await lkEnc(m.key,{data:dt}),ts:now})}
    await put(Object.assign({},n,{enc:await lkEnc(m.key,pl)}))}
  await put(m.doc);S.lk=m.key;
}
async function lkReset(){
  for(const n of lockedNotes())await drop(n.id);
  for(const x of [...S.items.values()])if(x.kind==='img'&&x.enc)await drop(x.id);
  await drop('lock');lkClear();
}
function lkClear(){S.lk=null;S.lkPlain=new Map();S.lkImg=new Map();S.lkPend=false;clearTimeout(lkTimer)}
function lkRelock(){
  if(!S.lk){S.lkPend=false;return}
  if(S.nd||lkM){S.lkPend=true;return}
  lkClear();if(S.tab==='notes')render();
}
function lkIdle(){clearTimeout(lkTimer);if(S.lk)lkTimer=setTimeout(lkRelock,5*60*1000)}
['pointerdown','keydown'].forEach(e=>document.addEventListener(e,()=>{if(S.lk)lkIdle()},true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)lkRelock()});
const LK_T={enter:'Locked notes',setup:'Create a code',change:'Change code',manage:'Code settings',reset:'Forgot code'};
function lkHtml(){
  const m=lkM,err=m.err?`<p class="err" role="alert">${esc(m.err)}</p>`:'';
  const inp=(id,label,ac)=>`<label class="lkl">${label}<input class="tin lkin" id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="${ac||'off'}"></label>`;
  let h='';
  if(m.mode==='enter')h=`<p class="bk-small" style="margin-top:0">Enter your code (6 to 8 digits) to see your locked notes.</p>${inp('lkA','Code')}${err}<button class="btn" type="submit">Unlock</button>`;
  else if(m.mode==='setup'||m.mode==='change')h=`<p class="bk-small" style="margin-top:0">Choose a code of 6 to 8 digits (numbers only). Locked notes are scrambled with it. <b>Nobody can read them without the code, and it cannot be recovered if you forget it.</b> Write it down somewhere safe.</p>${inp('lkA','New code (6 to 8 digits)','new-password')}${inp('lkB','Type it again','new-password')}${err}<button class="btn" type="submit">${m.mode==='setup'?'Set code':'Change code'}</button>`;
  else if(m.mode==='manage')h=`<button type="button" class="btn ghost" data-action="lk-change">Change code</button><button type="button" class="btn ghost" data-action="lk-reset">Forgot code…</button>`;
  else if(m.mode==='reset')h=`<p>This deletes <b>all locked notes</b> and removes the code. Your other notes are not touched. It cannot be undone.</p><button type="button" class="btn" data-action="lk-reset-go">Delete locked notes and reset</button><button type="button" class="btn ghost" data-action="lk-close">Cancel</button>`;
  return `<div class="scrim" data-action="lk-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lkT" tabindex="-1"><div class="sheet-head"><h2 id="lkT">${LK_T[m.mode]}</h2><button class="iconbtn" data-action="lk-close" aria-label="Close">${XICON}</button></div><div class="sheet-body"><form id="lkForm" autocomplete="off">${h}</form></div></div>`;
}
function lkPaint(){const r=$('#lkRoot');r.innerHTML=lkHtml();r.querySelectorAll('.sheet,.scrim').forEach(e=>{e.style.animation='none'});const i=r.querySelector('input');if(i)i.focus();else r.querySelector('.sheet').focus()}
function lkInert(on){if(S.nd)$('#ntRoot').inert=on;else{document.querySelector('.app').inert=on;document.querySelector('.tabbar').inert=on;document.documentElement.style.overflow=on?'hidden':''}}
function openLk(mode,then){
  if(!lkOk()){toast('Locking is not available in this browser.');return}
  lkM={mode,then,err:'',busy:false};S.lkFocus=document.activeElement;
  const r=$('#lkRoot');r.hidden=false;r.innerHTML=lkHtml();lkInert(true);const i=r.querySelector('input');if(i)i.focus();else r.querySelector('.sheet').focus();
}
function closeLk(){
  const r=$('#lkRoot');r.hidden=true;r.innerHTML='';lkM=null;lkInert(false);
  if(S.lkFocus&&S.lkFocus.focus&&document.contains(S.lkFocus))S.lkFocus.focus();
  if(S.lkPend)lkRelock();
}
async function lkSubmit(){
  const m=lkM;if(!m||m.busy)return;
  const a=($('#lkA')||{}).value||'',b=($('#lkB')||{}).value||'';
  const fail=msg=>{m.err=msg;m.busy=false;lkPaint()};
  m.busy=true;const btn=$('#lkForm [type=submit]');if(btn)btn.disabled=true;
  if(!/^\d{6,8}$/.test(a))return fail('The code must be 6 to 8 digits.');
  try{
    if(m.mode==='enter'){
      if(Date.now()<S.lkUntil)return fail('Too many tries. Wait 30 seconds.');
      if(!(await lkUnlock(a))){S.lkFail++;if(S.lkFail%5===0)S.lkUntil=Date.now()+30000;return fail('Wrong code.')}
      S.lkFail=0;
    }else{
      if(a!==b)return fail('The two codes do not match.');
      if(m.mode==='setup')await lkSetup(a);else await lkChange(a);
    }
  }catch(e){return fail('Something went wrong. Try again.')}
  const t=m.then;closeLk();lkIdle();if(t)t();
}

const MAXNP=6,MAXNV=5;
const ntDay=n=>{if(n.date)return n.date;const d=new Date(n.ts||n.upd||Date.now());return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};

function ncardHtml(n,lk){
  const body=(n.body||'').trim(),t=(n.title||'').trim(),prev=t?body:body.split('\n').slice(1).join('\n').trim();
  const srcs=(n.photos||[]).map(id=>lk?S.lkImg.get(id):(S.items.get(id)||{}).data).filter(Boolean);
  const th=srcs.length?`<span class="thumbs">${srcs.slice(0,4).map(x=>`<img src="${x}" alt="Photo">`).join('')}${srcs.length>4?`<span class="more">+${srcs.length-4}</span>`:''}</span>`:'';
  return `<button class="ncard${tagStripe(n.tags)?' tgd':''}"${tagStyle(n.tags)} data-action="nt-edit" data-id="${esc(n.id)}"><h3>${lk?LOCKI:n.pin?'<span class="pinmk" aria-label="Pinned">★</span>':''}${esc(ntTitle(n))}</h3>${prev?`<p>${esc(prev)}</p>`:''}${th}${vidChip(n)}${tagLine(n)}<time>${esc(L(ntDay(n),{day:'numeric',month:'short',year:'numeric'}))}</time></button>`;
}
function ntList(){
  const q=(S.nq||'').trim().toLowerCase();
  const tf=tagOf(S.tfn)?S.tfn:'';
  const f=n=>(!q||((n.title||'')+' '+(n.body||'')+' '+tagNames(n.tags)).toLowerCase().includes(q))&&(!tf||(n.tags||[]).includes(tf));
  const srt=(a,b)=>(b.pin?1:0)-(a.pin?1:0)||ntDay(b).localeCompare(ntDay(a))||(b.ts||0)-(a.ts||0);
  const l=notes().sort(srt).filter(f);
  let h=l.length?l.map(n=>ncardHtml(n,false)).join(''):(q||tf)?'<p class="muted">No notes match.</p>':`<div class="empty">${face(3)}<h2>A blank page, just for you</h2><p>Write anything: ideas, things to remember, kendo thoughts. Add photos and video links too. Tap New note to start.</p></div>`;
  if(S.lk){
    const ln=lockedNotes().map(d=>Object.assign({},d,S.lkPlain.get(d.id)||{title:'Cannot open this note',photos:[],videos:[]})).sort(srt).filter(f);
    h+=`<h2 class="day-h">${LOCKI} Locked notes</h2>`+(ln.length?ln.map(n=>ncardHtml(n,true)).join(''):`<p class="muted">${(q||tf)?'No locked notes match.':'No locked notes yet. Open a note and tap Lock.'}</p>`)
      +`<div class="nact"><button class="btn ghost small" data-action="lk-manage">Code settings</button><button class="btn ghost small" data-action="lk-now">Lock now</button></div>`;
  }
  return h;
}

const ntHint=n=>(n.locked?'This note will be hidden. See it with the lock button at the top of Notes. ':'Notes save automatically when you close this. ')+(n.upd?'Last edited '+new Date(n.upd).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'.':'');

function openNote(id){
  const src=id?S.items.get(id):null;let n;
  if(src&&src.locked){

  }else if(src)n={id,title:src.title||'',body:src.body||'',videos:[...(src.videos||[])],ph:(src.photos||[]).map(i=>({id:i,data:(S.items.get(i)||{}).data})).filter(p=>p.data),tags:[...(src.tags||[])],pin:!!src.pin,locked:false,ts:src.ts,upd:src.upd,date:ntDay(src),orig:[...(src.photos||[])]};

}
async function ntSave(n){
  const vids=n.videos.map(u=>u.trim()).filter(u=>/^https?:\/\/\S+$/i.test(u)).slice(0,MAXNV);
  const id=n.id||newId('n'),now=Date.now(),ids=n.ph.map(p=>p.id),ntags=(n.tags||[]).filter(t=>tagOf(t));
  const base={kind:'note',id,pin:!!n.pin,date:/^\d{4}-\d{2}-\d{2}$/.test(n.date||'')?n.date:todayStr(),ts:n.ts||now,upd:now};
  try{
    if(n.locked){
      if(!S.lk){toast('The note is locked, so it was not saved.');return}
      const enc=await lkEnc(S.lk,{title:n.title,body:n.body,videos:vids,photos:ids,tags:ntags});
      for(const p of n.ph){const cur=S.items.get(p.id);if(!cur||!cur.enc)await put({kind:'img',id:p.id,enc:await lkEnc(S.lk,{data:p.data}),ts:now})}
      S.lkPlain.set(id,{title:n.title,body:n.body,videos:vids,photos:ids,tags:ntags});n.ph.forEach(p=>S.lkImg.set(p.id,p.data));
      await put(Object.assign(base,{locked:true,enc}));
    }else{
      for(const p of n.ph){const cur=S.items.get(p.id);if(!cur||!cur.data)await put({kind:'img',id:p.id,data:p.data,ts:now})}
      await put(Object.assign(base,{title:n.title.trim(),body:n.body,videos:vids,photos:ids,tags:ntags}));
      S.lkPlain.delete(id);
    }
    for(const o of n.orig)if(!ids.includes(o)){await drop(o);S.lkImg.delete(o)}
  }catch(e){toast("Couldn't save the note.")}
}
async function closeNote(save){
  const n=S.nd;if(!n)return;
  S.nd=null;closeNtUi();
  const has=n.title.trim()||n.body.trim()||n.ph.length||n.videos.some(v=>v.trim());
  if(save&&n.dirty&&has)await ntSave(n);
  if(S.lkPend)lkRelock();
}
async function deleteNote(){
  const n=S.nd;if(!n)return;
  S.nd=null;closeNtUi();
  if(n.id){await softDel(n.id)}
  toast('Note moved to Trash. You can restore it for 30 days.');if(S.lkPend)lkRelock();
}
async function addNtPhotos(files){
  const n=S.nd;if(!n)return;
  const room=MAXNP-n.ph.length;if(files.length>room)toast('Up to '+MAXNP+' photos per note.');
  for(const f of files.slice(0,Math.max(0,room))){
    try{const data=await shrink(f);if(S.nd!==n)return;n.ph.push({id:newId('p'),data});n.dirty=true;renderNtPhotos()}
    catch(e){toast("Couldn't read that photo. Try a JPEG or PNG.")}
  }
}

const TG_H=[2,24,44,88,150,174,202,228,268,320];

const tagsAll=()=>[...S.items.values()].filter(x=>x.kind==='tag').sort((a,b)=>(a.ts||0)-(b.ts||0));

function tgAdd(ctx){

function tgCount(id){return [...S.items.values()].filter(x=>!x.deletedAt&&(x.kind==='entry'||(x.kind==='note'&&!x.locked))&&(x.tags||[]).includes(id)).length+(S.lk?lockedNotes().filter(d=>((S.lkPlain.get(d.id)||{}).tags||[]).includes(id)).length:0)}

function saveEvent(){

function exPaint(){const r=$('#exRoot');r.innerHTML=exHtml();r.querySelectorAll('.sheet,.scrim').forEach(x=>{x.style.animation='none'})}
function openEx(id,ds,time,place){
  const c=S.items.get(id);if(!c)return;const x=clEx(c,ds);
  S.ex={id,ds,mode:x?(x.moveTo?'moved':x.off?'off':'changed'):'normal',moveTo:(x&&x.moveTo)||'',time:(x&&x.time)||time||'',place:(x&&x.place)||'',note:(x&&x.note)||'',err:''};
  S.lastFocus=document.activeElement;
  const r=$('#exRoot');r.innerHTML=exHtml();r.hidden=false;
  document.querySelector('.app').inert=true;document.querySelector('.tabbar').inert=true;document.documentElement.style.overflow='hidden';
  r.querySelector('.sheet').focus();

  const r=$('#exRoot');r.hidden=true;r.innerHTML='';S.ex=null;
  document.querySelector('.app').inert=false;document.querySelector('.tabbar').inert=false;document.documentElement.style.overflow='';
  if(S.lastFocus&&S.lastFocus.focus&&document.contains(S.lastFocus))S.lastFocus.focus();
}
function saveEx(){
  const e=S.ex,c=S.items.get(e.id);if(!c)return closeEx();
  const ex=Object.assign({},c.ex||{});
  if(e.mode==='normal')delete ex[e.ds];
  else if(e.mode==='off')ex[e.ds]={off:1,note:e.note.trim()};
  else if(e.mode==='moved'){
    if(!/^\d{4}-\d\d-\d\d$/.test(e.moveTo||'')){e.err='Pick the new date.';exPaint();return}
    if(e.moveTo===e.ds){e.err='That is the same day. Use Changed time / place instead.';exPaint();return}
    if(!/^\d{2}:\d{2}$/.test(e.time||'')){e.err='Pick a time.';exPaint();return}
    ex[e.ds]={off:1,moveTo:e.moveTo,time:e.time,place:e.place.trim()&&e.place.trim()!==(c.place||'')?e.place.trim():'',note:e.note.trim()};
  }
  else{
    const base=clTime(c,e.ds),t=/^\d{2}:\d{2}$/.test(e.time)&&e.time!==base?e.time:'',pl=e.place.trim()&&e.place.trim()!==(c.place||'')?e.place.trim():'';
    if(!t&&!pl){e.err='Set a new time or a new place.';exPaint();return}
    ex[e.ds]={time:t,place:pl,note:e.note.trim()};
  }
  put(Object.assign({},c,{ex}));closeEx();toast(e.mode==='off'?'Class cancelled for that day':e.mode==='moved'?'Class moved to '+L(e.moveTo,{weekday:'short',day:'numeric',month:'short'}):e.mode==='changed'?'Class changed for that day':'Back to normal');
}

document.addEventListener('input',ev=>{
  const t=ev.target;if(t.id==='tgName'){if(S.tg)S.tg.name=t.value;return}if(t.dataset&&t.dataset.tgname!==undefined)return;if(t.id==='nmTitle'||t.id==='nmSub'){if(t.id==='nmTitle')nmSel.t=t.value;else nmSel.s=t.value;nmSave();nmApply();return}
  if(t.classList&&t.classList.contains('lkin')){t.value=t.value.replace(/\D/g,'').slice(0,8);if(lkM&&lkM.mode==='enter'&&t.value.length===8)lkSubmit();return}
  if(t.id==='srQ'){S.sq=t.value;const rb=$('#srRes');if(rb)rb.innerHTML=srHtml();return}
  if(t.id==='ntSearch'){S.nq=t.value;const b=$('#ntListBox');if(b)b.innerHTML=ntList();return}
  if(S.nd){const n=S.nd;if(t.id==='ntDate'){if(t.value){n.date=t.value;n.dirty=true}}else if(t.id==='ntTitle'){n.title=t.value;n.dirty=true}else if(t.id==='ntBody'){n.body=t.value;n.dirty=true}else if(t.dataset&&t.dataset.ntvid!==undefined){const i=+t.dataset.ntvid;n.videos[i]=t.value;n.dirty=true;const pv=$('#ntvp'+i);if(pv)pv.innerHTML=vidPreview(t.value)}return}
  if(S.ex&&t.closest&&t.closest('#exRoot')){if(t.id==='exTime')S.ex.time=t.value;else if(t.id==='exDate')S.ex.moveTo=t.value;else if(t.id==='exPlace')S.ex.place=t.value;else if(t.id==='exNote')S.ex.note=t.value;return}
  if(S.cd&&t.closest&&t.closest('#clRoot')){clInput(t);return}
  if(S.ev&&t.closest&&t.closest('#evRoot')){evInput(t);return}
  const d=S.draft;if(!d)return;
  if(t.dataset&&t.dataset.rep!==undefined){d.k.repsBy=d.k.repsBy||{};d.k.repsBy[t.dataset.rep]=Math.max(0,Math.min(5000,+t.value||0));updateRepTot();return}
  if(t.dataset&&t.dataset.vid!==undefined){const i=+t.dataset.vid;d.videos[i]=t.value;const p=$('#vp'+i);if(p)p.innerHTML=vidPreview(t.value);return}
  switch(t.id){
    case 'fDate':d.date=t.value;break;
    case 'fTime':d.time=t.value;break;
    case 'fNote':d.note=t.value;break;
    case 'fPlace':d.place=t.value;syncSheet();break;
    case 'kMinIn':d.k.min=Math.max(0,+t.value||0);syncSheet();break;
    case 'kWhere':d.k.where=t.value;break;
    case 'kReps':d.k.reps=Math.max(0,+t.value||0);break;
    case 'kGood':d.k.good=t.value;break;
    case 'kNext':d.k.next=t.value;break;
  }
});
setInterval(()=>{if(S.draft)draftStash()},1500);document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.draft)draftStash()});window.addEventListener('pagehide',()=>{if(S.draft)draftStash()});
document.addEventListener('error',ev=>{const t=ev.target;if(t&&t.classList&&t.classList.contains('vth'))t.remove()},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){const m=$('#qaMenu');if(m&&!m.hidden){qaClose();const tb=document.querySelector('[data-action="qa-toggle"]');if(tb)tb.focus();return}}if(ev.key==='Enter'&&ev.target&&ev.target.id==='tgName'&&S.tg){ev.preventDefault();tgAdd(S.tg.ctx);return}if(ev.key==='Escape'){if(!$('#lightbox').hidden)closeLightbox();else if(!$('#tgRoot').hidden){closeTgm();render()}else if(!$('#lkRoot').hidden)closeLk();else if(!$('#exRoot').hidden)closeEx();else if(!$('#bkRoot').hidden)closeBackup();else if(!$('#thRoot').hidden)closeTheme();else if(!$('#clRoot').hidden)closeClass();else if(!$('#evRoot').hidden)closeEvent();else if(S.nd)closeNote(true);else if(S.draft)closeSheet()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='impFile'){importFile(t.files[0]);t.value='';return}if(t.id==='bkRemind'||t.id==='wlRemind'){LS_SET('kj-bk-remind',t.value);renderBars();return}if(t.id==='bkAuto'){setAuto(t.checked);return}if(t.id==='gcShow'){setGcal({show:t.checked});S.gerr='';S.gev={};render();renderBackup();return}if(t.id==='gcTasks'||t.id==='gcSess'){setGcal(t.id==='gcTasks'?{outTasks:t.checked}:{outSessions:t.checked});runCalSync(true);return}if(t.dataset&&t.dataset.tgname!==undefined){const g=tagOf(t.dataset.tgname),nm=t.value.trim();if(g&&nm&&nm!==g.name)put(Object.assign({},g,{name:nm}));else if(g&&!nm)t.value=g.name;return}if(t.id==='ntPhotos'){const fs=[...t.files];t.value='';if(fs.length)addNtPhotos(fs);return}if(t.id==='fpFile'){const f=t.files[0];t.value='';fpPick(f);return}if(t.id==='fPhotos'){const fs=[...t.files];t.value='';if(fs.length)addPhotos(fs)}});

/* ---------- start ---------- */
(function(){const t=todayStr(),dt=parse(t);S.sel=t;S.cal={y:dt.getFullYear(),m:dt.getMonth()}})();
render();
S.mcpP=(async()=>{try{const cl=window.claude;if(cl&&cl.use)S.mcp=await cl.use('mcp')}catch(e){S.mcp=null}S.mcpOk=!!S.mcp;renderBackup();renderPk()})();
initStore();
if('serviceWorker' in navigator){const hadCtl=!!navigator.serviceWorker.controller;let shown=false;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl||shown)return;shown=true;const a=document.querySelector('.app'),d=document.createElement('div');d.className='sbar';d.id='updBar';d.setAttribute('role','status');d.innerHTML='<span>A new version is ready.</span><button type=button id=updGo>Reload now</button>';a.insertBefore(d,a.querySelector('main'));d.querySelector('#updGo').onclick=()=>location.reload()});
window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
